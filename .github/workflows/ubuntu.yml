name: Ubuntu
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Install Lib
        run: sudo apt-get install cmake libhts-dev libtbb-dev -y
      - uses: actions/checkout@v1
      - name: Configure
        run: mkdir build && cd build && cmake .. -DINCLUDE_LIBRARY_PREFIX=/usr/include -DLIBRARY_LINK_PREFIX=/usr/lib/x86_64-linux-gnu
      - name: export LD_LIBRARY_PATH
        run: export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/x86_64-linux-gnu/
      - name: Include
        run: cd /usr/include && ls
      - name: Lib
        run: cd /usr/lib && ls
      - name: Lib
        run: cd /usr/ && ls
      - name: Lib
        run: cd /usr/local/ && ls
      - name: Lib
        run: cd /usr/lib/x86_64-linux-gnu/ && ls
      - name: Lib
        run: ldconfig -p | grep libhts
      - name: Build
        run: cd build && make
      - name: Test
        run: cd build && make install
