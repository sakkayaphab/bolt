name: Ubuntu
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Install Lib
        run: sudo apt-get install cmake libhts-dev libtbb-dev -y
      - uses: actions/checkout@v1
      - name: Configure
        run: mkdir build && cd build && cmake .. -DINCLUDE_LIBRARY_PREFIX=/usr/include -DLIBRARY_LINK_PREFIX=/usr/lib
      - name: Include
        run: cd /usr/include && ls
      - name: Lib
        run: cd /usr/lib32 && ls
      - name: Lib
        run: cd /usr/local && ls
      - name: Build
        run: cd build && make
      - name: Test
        run: cd build && make install
